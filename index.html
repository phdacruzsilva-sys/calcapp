<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle Financeiro – Motorista de App</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--txt:#1b2430;--mut:#667085;--pri:#0b7a5b;--bd:#dde3ea;--bad:#c62828;--warn:#b26a00;--ok:#1b7f3b}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--card:#1a222b;--txt:#e8edf2;--mut:#93a1b1;--pri:#1f9d76;--bd:#2c3744;--bad:#ff6b6b;--warn:#ffb74d;--ok:#5fd38a}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:14px 16px;background:var(--pri);color:#fff}
header h1{margin:0;font-size:18px}
header small{opacity:.85}
nav{display:flex;overflow-x:auto;gap:4px;padding:8px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{flex:none;border:0;background:transparent;color:var(--txt);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--pri);color:#fff}
main{max-width:980px;margin:0 auto;padding:12px}
h2{margin:0 0 10px;font-size:17px}
h3{margin:14px 0 6px;font-size:15px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.flash{border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:10px}
label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mut);gap:3px}
label.chk{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--txt)}
input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--txt);width:100%}
input[type=checkbox]{width:auto}
.btn{font:inherit;border:0;border-radius:8px;padding:9px 14px;background:var(--pri);color:#fff;cursor:pointer;margin:2px 4px 2px 0}
.btn.sec{background:transparent;color:var(--txt);border:1px solid var(--bd)}
.btn.del{background:transparent;color:var(--bad);border:1px solid var(--bd);padding:3px 8px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px;white-space:nowrap}
td.r,th.r{text-align:right}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--mut);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
.kpi{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:18px}
.kpi span{font-size:12px;color:var(--mut)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);font-size:12px;margin:2px 4px 2px 0}
</style>
</head>
<body>
<header><h1>Controle Financeiro para Motorista de App</h1>
<small>Seus dados ficam salvos somente neste aparelho (navegador). Projeto independente, sem vínculo com a Uber. Não é aconselhamento financeiro.</small></header>
<nav id="tabs"></nav>
<main id="view"></main>

<script>
/* ================= Utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(isFinite(n)?n:0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const nf=(n,d=2)=>(isFinite(n)?n:0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=n=>nf((isFinite(n)?n:0)*100,1)+'%';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return iso(new Date(y,m-1,d+n))};
const dayNum=s=>{const [y,m,d]=s.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/864e5)};
const fmtDate=s=>s?s.split('-').reverse().join('/'):'';
const sum=(a,k)=>a.reduce((t,x)=>t+(+x[k]||0),0);
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const N=v=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:0};
const sorted=a=>[...a].sort((x,y)=>y.data.localeCompare(x.data));
const COMB={gasolina:'Gasolina',etanol:'Etanol',eletrico:'Elétrico (kWh)'};
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

/* ================= Armazenamento local ================= */
const KEY='driverfinance_v1';
const DEF=()=>({vehicles:[],financings:[],expenses:[],fuel:[],workdays:[],catalog:null,
  settings:{depreciacao:10,cidade:'',viagens:0,nota:5,notaComfort:4.8,margem:30,meta:5000,diasMes:22}});
const merge=r=>{const d=DEF();return {...d,...r,settings:{...d.settings,...(r.settings||{})}}};
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));return r?merge(r):DEF()}catch(e){return DEF()}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Não foi possível salvar: armazenamento cheio ou bloqueado.')}}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

/* ================= Catálogo e regras de elegibilidade ================= */
const DEFAULT_CSV=`# marca;modelo;categoria;ano_minimo;cidade;excluido_desde;conferido_uber
# cidade: * = todas. excluido_desde: AAAA-MM-DD ou DD/MM/AAAA (vazio = sem exclusão)
# ATENÇÃO: anos mínimos abaixo são valores de REFERÊNCIA (conferido_uber=NAO). Confira no site/app da Uber.
Fiat;Mobi;UberX;2017;*;;NAO
Fiat;Argo;UberX;2017;*;;NAO
Fiat;Cronos;UberX;2018;*;;NAO
Chevrolet;Onix;UberX;2012;*;;NAO
Chevrolet;Onix Plus;UberX;2020;*;;NAO
Chevrolet;Cruze;UberX;2012;*;;NAO
Chevrolet;Cruze;Comfort;2016;*;;NAO
Hyundai;HB20;UberX;2012;*;;NAO
Hyundai;HB20S;UberX;2013;*;;NAO
Renault;Kwid;UberX;2018;*;;NAO
Renault;Logan;UberX;2012;*;;NAO
Renault;Logan;Comfort;2016;*;06/07/2026;NAO
Volkswagen;Gol;UberX;2012;*;;NAO
Volkswagen;Polo;UberX;2018;*;;NAO
Volkswagen;Virtus;UberX;2018;*;;NAO
Volkswagen;Virtus;Comfort;2018;*;;NAO
Nissan;Versa;UberX;2012;*;;NAO
Nissan;Versa;Comfort;2016;*;;NAO
Toyota;Yaris;UberX;2018;*;;NAO
Toyota;Corolla;UberX;2012;*;;NAO
Toyota;Corolla;Comfort;2016;*;;NAO
Toyota;Corolla;Black;2018;*;;NAO
Honda;City;UberX;2014;*;;NAO
Honda;City;Comfort;2018;*;;NAO
Honda;Civic;UberX;2012;*;;NAO
Honda;Civic;Comfort;2016;*;;NAO
Honda;Civic;Black;2018;*;;NAO
`;
function parseDate(s){if(!s)return null;s=s.trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)return s;m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:null}
function parseCatalog(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'))
   .map(l=>l.split(l.includes(';')?';':',').map(x=>x.trim()))
   .filter(c=>norm(c[0])!=='marca'&&c.length>=4)
   .map(c=>({marca:c[0],modelo:c[1],cat:c[2],ano:+c[3]||0,cidade:c[4]||'*',excl:parseDate(c[5]),conf:(c[6]||'NAO').toUpperCase()}));
}
const catalog=()=>parseCatalog(S.catalog||DEFAULT_CSV);
const BLACK_COLORS=['preto','cinza','prata','branco','azul-marinho','azul marinho','marrom','chumbo'];

function elig(v){
  const motivos=[];
  if(v.portas<4)motivos.push('Menos de 4 portas');
  if(!v.ar)motivos.push('Sem ar-condicionado');
  if(v.placaVermelha)motivos.push('Placa vermelha');
  if(v.adesivado)motivos.push('Veículo adesivado');
  if(v.sinistrado)motivos.push('Veículo sinistrado');
  if(v.suspensao)motivos.push('Suspensão/freios alterados');
  const rows=catalog().filter(r=>norm(r.marca+' '+r.modelo)===norm(v.modelo));
  const cats=[];
  if(!rows.length)return {motivos,cats,naoListado:true};
  ['UberX','Comfort','Black'].forEach(cat=>{
    const rs=rows.filter(r=>norm(r.cat)===norm(cat));
    if(!rs.length)return;
    const r=rs.find(x=>x.cidade!=='*'&&norm(x.cidade)===norm(v.cidade))||rs.find(x=>x.cidade==='*'||x.cidade==='');
    if(!r){cats.push({cat,veiculoOk:false,motoristaOk:true,mot:['Categoria não disponível na cidade informada'],dm:[],conf:'NAO'});return}
    const m=[...motivos];
    if(v.ano<r.ano)m.push(`Ano mínimo ${r.ano} (o seu: ${v.ano})`);
    if(r.excl&&r.excl<=today())m.push(`Modelo excluído desde ${fmtDate(r.excl)}`);
    if(cat==='Black'&&!BLACK_COLORS.includes(norm(v.cor)))m.push('Cor não aceita no Black');
    const dm=[];
    if(cat!=='UberX'){
      const min=cat==='Black'?4.85:S.settings.notaComfort;
      if(!(S.settings.viagens>100))dm.push('Precisa de mais de 100 viagens');
      if(S.settings.nota<min)dm.push(`Nota mínima ${nf(min)} (a sua: ${nf(S.settings.nota)})`);
    }
    cats.push({cat,veiculoOk:m.length===0,motoristaOk:dm.length===0,mot:m,dm,conf:r.conf,ano:r.ano});
  });
  return {motivos,cats};
}

/* ================= Cálculos ================= */
function consumption(){
  const groups={};
  S.fuel.forEach(f=>{const k=f.vehicleId+'|'+f.comb;(groups[k]=groups[k]||[]).push(f)});
  const out=[];
  for(const k in groups){
    const arr=groups[k].filter(f=>f.odo>0).sort((a,b)=>a.odo-b.odo);
    let last=null,lit=0,cost=0,km=0,L=0,C=0;
    arr.forEach(f=>{
      if(last===null){if(f.cheio)last=f.odo;return}
      lit+=f.litros;cost+=f.total;
      if(f.cheio){km+=f.odo-last;L+=lit;C+=cost;last=f.odo;lit=0;cost=0}
    });
    if(L>0&&km>0){const [vehicleId,comb]=k.split('|');out.push({vehicleId,comb,km,litros:L,custo:C,cons:km/L,ckm:C/km})}
  }
  return out;
}
function costPerKm(){
  const c=consumption(),km=sum(c,'km');
  if(km>0)return sum(c,'custo')/km;
  for(const f of sorted(S.fuel)){
    const v=S.vehicles.find(x=>x.id===f.vehicleId),cons=v&&v.cons[f.comb];
    if(cons>0&&f.preco>0)return f.preco/cons;
  }
  return 0;
}
function expInRange(e,from,to){
  if(e.rec==='unico')return e.data>=from&&e.data<=to?e.valor:0;
  const s=e.data>from?e.data:from;
  if(s>to)return 0;
  const d=dayNum(to)-dayNum(s)+1;
  return e.valor*d/(e.rec==='anual'?365:30.4375);
}
function implicitRate(pv,pmt,n){
  if(pv<=0||pmt*n<=pv)return 0;
  let lo=0,hi=1;
  for(let i=0;i<100;i++){const mid=(lo+hi)/2;const val=pmt*(1-Math.pow(1+mid,-n))/mid;if(val>pv)lo=mid;else hi=mid}
  return (lo+hi)/2;
}
function report(from,to){
  const dias=dayNum(to)-dayNum(from)+1,inR=d=>d>=from&&d<=to;
  const wd=S.workdays.filter(w=>inR(w.data));
  const ganhos=sum(wd,'ganhos'),gorj=sum(wd,'gorjetas'),km=sum(wd,'km'),horas=sum(wd,'horas'),corridas=sum(wd,'corridas');
  const bruto=ganhos+gorj;
  const fl=S.fuel.filter(f=>inR(f.data));
  let comb=sum(fl,'total'),est=false;
  if(!fl.length&&km>0){const c=costPerKm();if(c>0){comb=km*c;est=true}}
  const porTipo={};let custos=0;
  S.expenses.forEach(e=>{const v=expInRange(e,from,to);if(v>0){custos+=v;porTipo[e.tipo]=(porTipo[e.tipo]||0)+v}});
  const fin=S.financings.reduce((t,f)=>t+(f.pagas<f.n?f.parcela*dias/30.4375:0),0);
  const dep=S.vehicles.reduce((t,v)=>t+v.valor*S.settings.depreciacao/100*dias/365,0);
  const caixa=bruto-comb-custos-fin;
  return {from,to,dias,nDias:wd.length,ganhos,gorj,bruto,km,horas,corridas,comb,est,custos,porTipo,fin,dep,caixa,real:caixa-dep};
}
const FUEL_WARN=0.30,FUEL_BAD=0.40,FIN_RISK=0.25; // limites do Advisor

/* ================= Componentes de formulário ================= */
const F=(label,name,attrs='',type='number')=>`<label>${label}<input name="${name}" type="${type}" ${type==='number'?'step="any" inputmode="decimal"':''} ${attrs}></label>`;
const SEL=(label,name,opts,sel='')=>`<label>${label}<select name="${name}">${opts.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${v===sel?' selected':''}>${esc(t)}</option>`}).join('')}</select></label>`;
const CHK=(label,name,on)=>`<label class="chk"><input type="checkbox" name="${name}"${on?' checked':''}> ${label}</label>`;
const vOpts=()=>S.vehicles.map(v=>[v.id,`${v.modelo} ${v.ano}`]);
const vn=id=>{const v=S.vehicles.find(x=>x.id===id);return v?`${v.modelo} ${v.ano}`:'Geral'};
const card=h=>`<div class="card">${h}</div>`;
const needVeh=()=>card('<p>Cadastre um veículo primeiro na aba <b>Veículo</b>.</p>');
const delBtn=(c,id)=>`<button class="btn del" data-del="${c}:${id}" title="Excluir">×</button>`;
const kpi=(t,v,cls='')=>`<div class="kpi"><b class="${cls}">${v}</b><span>${t}</span></div>`;
const row=(a,b,cls='')=>`<tr><td>${a}</td><td class="r ${cls}">${b}</td></tr>`;
function fd(form){const o={};new FormData(form).forEach((v,k)=>o[k]=v);form.querySelectorAll('input[type=checkbox]').forEach(c=>o[c.name]=c.checked);return o}

/* ================= Telas ================= */
let flash='';
let REP={r:'30',from:today(),to:today()};
const V={};

V.veiculo=()=>{
  const models=[...new Set(catalog().map(r=>r.marca+' '+r.modelo))].sort();
  const list=S.vehicles.map(v=>{
    const e=elig(v);
    let cats='';
    if(e.naoListado)cats='<p class="warn">Modelo não encontrado no catálogo. Confira os requisitos no site da Uber ou importe seu catálogo em Configurações.</p>';
    else if(!e.cats.length)cats='<p class="bad">Nenhuma categoria disponível para este modelo.</p>';
    else cats=e.cats.map(c=>{
      const ok=c.veiculoOk&&c.motoristaOk;
      const why=[...c.mot,...c.dm];
      const ref=c.conf!=='SIM'?' <span class="mut">(ano de referência, não conferido)</span>':'';
      return `<div><span class="tag ${ok?'ok':c.veiculoOk?'warn':'bad'}">${c.cat}: ${ok?'aceito':c.veiculoOk?'veículo ok, falta requisito do motorista':'recusado'}</span>${ref}${why.length?`<div class="mut">${why.map(esc).join(' · ')}</div>`:''}</div>`;
    }).join('');
    if(e.motivos.length)cats=`<p class="bad">Problemas gerais: ${e.motivos.join(', ')}.</p>`+cats;
    return card(`<div style="display:flex;justify-content:space-between"><h2>${esc(v.modelo)} ${v.ano} · ${esc(v.cor)}</h2>${delBtn('vehicles',v.id)}</div>
      <p class="mut">${esc(v.cidade||'cidade não informada')} · Odômetro ${nf(v.odo,0)} km · Valor de mercado ${brl(v.valor)}</p>${cats}`);
  }).join('');
  return card(`<h2>Novo veículo</h2><form data-form="veiculo">
    <datalist id="dl-modelos">${models.map(m=>`<option value="${esc(m)}">`).join('')}</datalist>
    <datalist id="dl-cores">${['Preto','Cinza','Prata','Branco','Azul-marinho','Marrom','Chumbo','Vermelho','Azul','Verde','Amarelo','Bege'].map(c=>`<option value="${c}">`).join('')}</datalist>
    <div class="grid">
      <label>Modelo (escolha do catálogo)<input name="modelo" list="dl-modelos" required placeholder="Ex.: Honda Civic"></label>
      ${F('Ano','ano','required min="1990" max="2100"')}
      <label>Cor<input name="cor" list="dl-cores" required></label>
      ${F('Portas','portas','value="4" min="2"')}
      ${F('Cidade','cidade',`value="${esc(S.settings.cidade)}"`,'text')}
      ${F('Odômetro atual (km)','odo','min="0" value="0"')}
      ${F('Valor de mercado (R$)','valor','min="0" value="0"')}
      ${F('Consumo declarado gasolina (km/l)','cg','min="0"')}
      ${F('Consumo declarado etanol (km/l)','ce','min="0"')}
      ${F('Consumo declarado elétrico (km/kWh)','ck','min="0"')}
    </div>
    <div class="grid">${CHK('Ar-condicionado','ar',true)}${CHK('Placa vermelha','pv')}${CHK('Adesivado','ad')}${CHK('Sinistrado','si')}${CHK('Suspensão/freios alterados','su')}</div>
    <button class="btn">Salvar veículo</button></form>`)+(list||card('<p class="mut">Nenhum veículo cadastrado.</p>'));
};

V.financiamento=()=>{
  if(!S.vehicles.length)return needVeh();
  const list=S.financings.map(f=>{
    const fin=f.valor-f.entrada,total=f.entrada+f.parcela*f.n,saldo=f.parcela*(f.n-f.pagas),taxa=implicitRate(fin,f.parcela,f.n);
    return `<tr><td>${esc(vn(f.vehicleId))}</td><td class="r">${brl(f.parcela)}</td><td class="r">${f.pagas}/${f.n}</td><td class="r">${brl(saldo)}</td><td class="r">${brl(total)}</td><td class="r">${nf(taxa*100)}% a.m.</td><td>${delBtn('financings',f.id)}</td></tr>`;
  }).join('');
  return card(`<h2>Financiamento</h2><form data-form="financiamento"><div class="grid">
    ${SEL('Veículo','vehicleId',vOpts())}
    ${F('Valor à vista do veículo (R$)','valor','required min="0"')}
    ${F('Entrada (R$)','entrada','value="0" min="0"')}
    ${F('Valor da parcela (R$)','parcela','required min="0"')}
    ${F('Nº de parcelas','n','required min="1"')}
    ${F('Parcelas já pagas','pagas','value="0" min="0"')}
  </div><button class="btn">Salvar financiamento</button></form>`)+
  card(`<h2>Financiamentos</h2>${list?`<div class="tbl"><table><tr><th>Veículo</th><th class="r">Parcela</th><th class="r">Pagas</th><th class="r">Saldo devedor</th><th class="r">Custo total</th><th class="r">Taxa implícita</th><th></th></tr>${list}</table></div>`:'<p class="mut">Nenhum financiamento.</p>'}`);
};

V.custos=()=>{
  const tipos=['Manutenção','Óleo','Pneus','Freios','Revisão','Seguro','IPVA','Licenciamento','Lavagem','Multa','Pedágio','Estacionamento','Outro'];
  const list=sorted(S.expenses).map(e=>`<tr><td>${fmtDate(e.data)}</td><td>${esc(e.tipo)}</td><td>${esc(e.desc)}</td><td>${e.rec}</td><td>${esc(vn(e.vehicleId))}</td><td class="r">${brl(e.valor)}</td><td>${delBtn('expenses',e.id)}</td></tr>`).join('');
  return card(`<h2>Novo custo</h2><form data-form="custo"><div class="grid">
    ${F('Data (início)','data',`required value="${today()}"`,'date')}
    ${SEL('Tipo','tipo',tipos)}
    ${F('Descrição','desc','','text')}
    ${F('Valor (R$)','valor','required min="0"')}
    ${SEL('Recorrência','rec',[['unico','Único'],['mensal','Mensal'],['anual','Anual']])}
    ${SEL('Veículo','vehicleId',[['','Geral'],...vOpts()])}
  </div><p class="mut">Custos mensais são rateados por dia (valor × dias ÷ 30,4375) e anuais (valor × dias ÷ 365), a partir da data de início.</p><button class="btn">Salvar custo</button></form>`)+
  card(`<h2>Custos cadastrados</h2>${list?`<div class="tbl"><table><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Recorrência</th><th>Veículo</th><th class="r">Valor</th><th></th></tr>${list}</table></div>`:'<p class="mut">Nenhum custo.</p>'}`);
};

V.abastecimento=()=>{
  if(!S.vehicles.length)return needVeh();
  const cons=consumption().map(c=>{
    const v=S.vehicles.find(x=>x.id===c.vehicleId),dec=v?v.cons[c.comb]:0;
    const bad=dec>0&&c.cons<dec*0.85;
    return `<tr><td>${esc(vn(c.vehicleId))}</td><td>${COMB[c.comb]}</td><td class="r">${nf(c.cons)}</td><td class="r">${dec?nf(dec):'-'}</td><td class="r">${brl(c.ckm)}</td><td class="${bad?'bad':'ok'}">${bad?'Consumo 15%+ pior que o declarado':'OK'}</td></tr>`;
  }).join('');

function range(){
  const t=today();
  switch(REP.r){case 'hoje':return [t,t];case '7':return [addDays(t,-6),t];case 'mes':return [t.slice(0,8)+'01',t];case '30':return [addDays(t,-29),t];default:return [REP.from,REP.to]}
}
V.relatorio=()=>{
  const [from,to]=range();
  const sel=`<div class="grid">
    <label>Período<select data-rep="r">${[['hoje','Hoje'],['7','Últimos 7 dias'],['mes','Mês atual'],['30','Últimos 30 dias'],['livre','Período livre']].map(([v,t])=>`<option value="${v}"${REP.r===v?' selected':''}>${t}</option>`).join('')}</select></label>
    ${REP.r==='livre'?`<label>De<input type="date" data-rep="from" value="${REP.from}"></label><label>Até<input type="date" data-rep="to" value="${REP.to}"></label>`:''}</div>`;
  if(from>to)return card(`<h2>Relatório</h2>${sel}<p class="bad">A data inicial é maior que a final.</p>`);
  const r=report(from,to);
  const fuelShare=r.bruto>0?r.comb/r.bruto:0,finShare=r.bruto>0?r.fin/r.bruto:0;
  const alerts=[];
  if(r.est)alerts.push('Sem abastecimentos no período: o combustível foi estimado (km × custo por km).');
  if(fuelShare>FUEL_BAD)alerts.push(`Combustível em ${pct(fuelShare)} do faturamento: não compensa.`);
  else if(fuelShare>FUEL_WARN)alerts.push(`Combustível em ${pct(fuelShare)} do faturamento: atenção.`);
  if(finShare>FIN_RISK)alerts.push(`Parcela em ${pct(finShare)} do faturamento: risco alto.`);
  const tipos=Object.entries(r.porTipo).map(([t,v])=>row('&nbsp;&nbsp;'+esc(t),brl(v))).join('');
  return card(`<h2>Relatório · ${fmtDate(from)} a ${fmtDate(to)}</h2>${sel}
    <div class="kpis">${kpi('Lucro líquido (caixa)',brl(r.caixa),r.caixa>=0?'ok':'bad')}${kpi('Lucro real (com depreciação)',brl(r.real),r.real>=0?'ok':'bad')}${kpi('Faturamento',brl(r.bruto))}${kpi('R$/hora',brl(r.horas?r.bruto/r.horas:0))}${kpi('R$/km',brl(r.km?r.bruto/r.km:0))}</div>
    ${alerts.map(a=>`<p class="warn">${a}</p>`).join('')}
    <div class="tbl"><table>
      ${row('Dias trabalhados no período',r.nDias)}${row('Horas',nf(r.horas,1))}${row('Km rodados',nf(r.km,0))}${row('Corridas',r.corridas)}
      ${row('Ganhos',brl(r.ganhos))}${row('Gorjetas',brl(r.gorj))}
      ${row('(−) Combustível'+(r.est?' (estimado)':''),brl(r.comb))}${row('(−) Custos',brl(r.custos))}${tipos}
      ${row('(−) Financiamento (parcelas rateadas)',brl(r.fin))}
      ${row('<b>Lucro líquido (caixa)</b>',`<b>${brl(r.caixa)}</b>`)}
      ${row('(−) Depreciação',brl(r.dep))}
      ${row('<b>Lucro real</b>',`<b>${brl(r.real)}</b>`)}
    </table></div><br><button class="btn sec" data-act="csv">Exportar CSV</button>`);
};

V.estrategias=()=>{
  const t=today(),r=report(addDays(t,-29),t);
  let out='';
  if(!r.nDias||r.km<=0)out=card('<p>Registre dias de trabalho (aba <b>Dia de trabalho</b>) para gerar estratégias com base nos últimos 30 dias.</p>');
  else{
    const s=S.settings,custoKm=(r.comb+r.custos+r.fin+r.dep)/r.km,piso=custoKm*(1+s.margem/100),rkm=r.bruto/r.km;
    const f=r.bruto>0?r.comb/r.bruto:0,fixoDia=(r.custos+r.fin+r.dep)/r.dias;
    out+=card(`<h2>Piso de R$/km para aceitar corridas</h2><p>Seu custo total é de <b>${brl(custoKm)}/km</b>. Com margem de ${nf(s.margem,0)}%, aceite corridas acima de <b>${brl(piso)}/km</b>. Seu ganho médio atual é de ${brl(rkm)}/km ${rkm>=piso?'<span class="ok">(acima do piso)</span>':'<span class="bad">(abaixo do piso)</span>'}.</p>`);
    if(f<1){
      const be=fixoDia/(1-f),G=(s.meta+fixoDia*30.4375)/(1-f),porDia=G/Math.max(1,s.diasMes);
      out+=card(`<h2>Ponto de equilíbrio</h2><p>Custos fixos rateados: ${brl(fixoDia)}/dia (custos + financiamento + depreciação). Combustível consome ${pct(f)} do faturamento. Você precisa faturar cerca de <b>${brl(be)}/dia</b> (≈ ${nf(be/rkm,0)} km) para empatar.</p>`);
      out+=card(`<h2>Plano para a meta mensal</h2><p>Para um lucro de ${brl(s.meta)}/mês, o faturamento necessário é de <b>${brl(G)}</b> no mês. Trabalhando ${s.diasMes} dias, são <b>${brl(porDia)}/dia</b>, ou cerca de ${nf(porDia/rkm,0)} km/dia ao ritmo atual de ${brl(rkm)}/km. Ajuste a meta e os dias em Configurações.</p>`);
    }
    const parc=S.financings.reduce((a,x)=>a+(x.pagas<x.n?x.parcela:0),0);
    if(parc>0){
      const rev=r.bruto/r.dias*30.4375,sh=rev>0?parc/rev:0;
      out+=card(`<h2>Peso do financiamento</h2><p>Parcelas somam ${brl(parc)}/mês, cerca de <b class="${sh>FIN_RISK?'bad':'ok'}">${pct(sh)}</b> do faturamento mensal estimado (${brl(rev)}). ${sh>FIN_RISK?'Acima de 25%: risco alto.':'Dentro do limite de 25%.'}</p>`);
    }
  }
  // dias da semana
  const wk=Array.from({length:7},()=>({n:0,b:0,h:0}));
  S.workdays.forEach(w=>{const [y,m,d]=w.data.split('-').map(Number),i=new Date(y,m-1,d).getDay();wk[i].n++;wk[i].b+=w.ganhos+w.gorjetas;wk[i].h+=w.horas});
  const used=wk.map((x,i)=>({...x,i})).filter(x=>x.n>0);
  if(used.length){
    const rank=[...used].sort((a,b)=>b.b/b.n-a.b/a.n);
    out+=card(`<h2>Dias da semana</h2><p>Melhor dia: <b>${DIAS[rank[0].i]}</b> (média ${brl(rank[0].b/rank[0].n)}). ${rank.length>1?`Pior dia: <b>${DIAS[rank[rank.length-1].i]}</b> (média ${brl(rank[rank.length-1].b/rank[rank.length-1].n)}).`:''}</p>
      <div class="tbl"><table><tr><th>Dia</th><th class="r">Registros</th><th class="r">Média/dia</th><th class="r">R$/h</th></tr>${used.map(x=>`<tr><td>${DIAS[x.i]}</td><td class="r">${x.n}</td><td class="r">${brl(x.b/x.n)}</td><td class="r">${brl(x.h?x.b/x.h:0)}</td></tr>`).join('')}</table></div>`);
  }
  // subir de categoria
  const up=S.vehicles.map(v=>{
    const e=elig(v);
    const falta=e.cats.filter(c=>!(c.veiculoOk&&c.motoristaOk));
    if(!falta.length)return '';
    return `<p><b>${esc(v.modelo)} ${v.ano}</b></p>`+falta.map(c=>`<p class="mut">${c.cat}: ${[...c.mot,...c.dm].map(esc).join(' · ')}</p>`).join('');
  }).join('');
  if(up)out+=card(`<h2>Requisitos para subir de categoria</h2>${up}`);
  return out;
};

/* ================= Ações dos formulários ================= */
const H={};
H.veiculo=o=>{
  S.vehicles.push({id:uid(),modelo:o.modelo.trim(),ano:N(o.ano),cor:o.cor.trim(),portas:N(o.portas),ar:o.ar,cidade:o.cidade.trim(),odo:N(o.odo),valor:N(o.valor),
    cons:{gasolina:N(o.cg),etanol:N(o.ce),eletrico:N(o.ck)},placaVermelha:o.pv,adesivado:o.ad,sinistrado:o.si,suspensao:o.su,maint:{}});
  flash='Veículo salvo.';
};
H.financiamento=o=>{
  const n=N(o.n),parcela=N(o.parcela);
  if(n<1||parcela<=0){alert('Informe parcela e número de parcelas válidos.');return false}
  S.financings.push({id:uid(),vehicleId:o.vehicleId,valor:N(o.valor),entrada:N(o.entrada),parcela,n,pagas:Math.min(N(o.pagas),n)});
  flash='Financiamento salvo.';
};
H.custo=o=>{S.expenses.push({id:uid(),data:o.data,tipo:o.tipo,desc:o.desc.trim(),valor:N(o.valor),rec:o.rec,vehicleId:o.vehicleId});flash='Custo salvo.'};
H.abastecimento=o=>{
  const litros=N(o.litros);let preco=N(o.preco),total=N(o.total);
  if(litros<=0){alert('Informe a quantidade.');return false}
  if(!total&&preco)total=litros*preco;
  if(!preco&&total)preco=total/litros;
  if(!total){alert('Informe o preço por litro ou o total pago.');return false}
  const odo=N(o.odo);
  S.fuel.push({id:uid(),data:o.data,vehicleId:o.vehicleId,comb:o.comb,litros,preco,total,odo,cheio:o.cheio});
  const v=S.vehicles.find(x=>x.id===o.vehicleId);if(v&&odo>v.odo)v.odo=odo;
  flash='Abastecimento salvo.';
};
H.dia=o=>{
  const w={id:uid(),data:o.data,horas:N(o.horas),km:N(o.km),corridas:N(o.corridas),ganhos:N(o.ganhos),gorjetas:N(o.gorjetas)};
  S.workdays.push(w);
  const b=w.ganhos+w.gorjetas,ck=costPerKm(),comb=w.km*ck;
  flash=`<b>Dia salvo.</b> Faturamento ${brl(b)} · ${brl(w.horas?b/w.horas:0)}/h · ${brl(w.km?b/w.km:0)}/km · `+(ck>0?`sobra após combustível: <b>${brl(b-comb)}</b> (combustível estimado em ${brl(comb)})`:'cadastre abastecimentos para calcular a sobra após combustível');
};
H.odo=o=>{const v=S.vehicles.find(x=>x.id===o.id);if(v)v.odo=N(o.odo);flash='Odômetro atualizado.'};
H.config=o=>{
  const s=S.settings;
  s.cidade=o.cidade.trim();s.viagens=N(o.viagens);s.nota=N(o.nota);s.notaComfort=N(o.notaComfort);
  s.depreciacao=N(o.depreciacao);s.margem=N(o.margem);s.meta=N(o.meta);s.diasMes=Math.max(1,N(o.diasMes));
  flash='Configurações salvas.';
};
H.combustivel=o=>{
  const pE=N(o.pe),pG=N(o.pg),kE=N(o.ke),kG=N(o.kg),rk=N(o.rk),out=$('#fuelOut');
  if(!(pE>0&&pG>0&&kE>0&&kG>0)){out.innerHTML='<p class="bad">Preencha todos os preços e consumos.</p>';return false}
  const ratio=pE/pG,lim=kE/kG,cE=pE/kE,cG=pG/kG;
  let v,cls;
  if(ratio<lim*0.97){v='Etanol compensa';cls='ok'}else if(ratio<=lim*1.03){v='No limite (diferença pequena)';cls='warn'}else{v='Gasolina compensa';cls='ok'}
  let share='';
  if(rk>0){
    const sh=Math.min(cE,cG)/rk;
    const vv=sh>FUEL_BAD?['Não compensa','bad']:sh>FUEL_WARN?['No limite','warn']:['Compensa','ok'];
    share=`<p>Com ganho de ${brl(rk)}/km, o combustível mais barato consome <b>${pct(sh)}</b> do faturamento: <b class="${vv[1]}">${vv[0]}</b>.</p>`;
  }
  out.innerHTML=`<div class="kpis">${kpi('Etanol ÷ gasolina (preço)',pct(ratio))}${kpi('Limite (km/l etanol ÷ gasolina)',pct(lim))}${kpi('Custo/km etanol',brl(cE))}${kpi('Custo/km gasolina',brl(cG))}</div><h3 class="${cls}">${v}</h3>${share}`;
  return false;
};

/* ================= Eventos ================= */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('submit',ev=>{
  const f=ev.target.closest('form[data-form]');if(!f)return;
  ev.preventDefault();
  const h=H[f.dataset.form];if(!h)return;
  const res=h(fd(f),f);
  if(res===false)return;
  save();
  if(f.dataset.form!=='combustivel')render();
});
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-tab],[data-del],[data-act],[data-maint]');if(!b)return;
  const d=b.dataset;
  if(d.tab){tab=d.tab;localStorage.setItem('df_tab',tab);render();window.scrollTo(0,0);return}
  if(d.del){
    const [c,id]=d.del.split(':');
    if(confirm('Excluir este registro?')){S[c]=S[c].filter(x=>x.id!==id);if(c==='vehicles')S.financings=S.financings.filter(f=>f.vehicleId!==id);save();render()}
    return;
  }
  if(d.maint){const [id,k]=d.maint.split(':'),v=S.vehicles.find(x=>x.id===id);if(v){v.maint=v.maint||{};v.maint[k]=v.odo;save();render()}return}
  if(d.act==='csv'){
    const [from,to]=range(),r=report(from,to);
    const L=[['Campo','Valor'],['Período',`${fmtDate(from)} a ${fmtDate(to)}`],['Dias trabalhados',r.nDias],['Horas',r.horas],['Km',r.km],['Corridas',r.corridas],['Ganhos',r.ganhos],['Gorjetas',r.gorj],['Combustível'+(r.est?' (estimado)':''),r.comb],['Custos',r.custos],['Financiamento',r.fin],['Lucro líquido (caixa)',r.caixa],['Depreciação',r.dep],['Lucro real',r.real]];
    dl(`relatorio_${from}_${to}.csv`,'\ufeff'+L.map(l=>l.map(x=>typeof x==='number'?nf(x).replace(/\./g,''):x).join(';')).join('\n'),'text/csv');
  }
  if(d.act==='export')dl(`driverfinance_backup_${today()}.json`,JSON.stringify(S,null,2),'application/json');
  if(d.act==='catReset'){S.catalog=null;save();flash='Catálogo embutido restaurado.';render()}
  if(d.act==='wipe'&&confirm('Apagar TODOS os dados deste aparelho? Esta ação não pode ser desfeita.')){S=DEF();save();flash='Dados apagados.';render()}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.rep){REP[t.dataset.rep]=t.value;render();return}
  if(t.dataset.file&&t.files[0]){
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        if(t.dataset.file==='catalog'){
          if(!parseCatalog(rd.result).length)throw new Error('vazio');
          S.catalog=rd.result;flash='Catálogo importado.';
        }else{
          const o=JSON.parse(rd.result);
          if(!Array.isArray(o.vehicles)||!Array.isArray(o.workdays))throw new Error('inválido');
          S=merge(o);flash='Backup restaurado.';
        }
        save();render();
      }catch(e){alert('Arquivo inválido.')}
    };
    rd.readAsText(t.files[0],'UTF-8');
  }
});

/* ================= Início ================= */
const TABS=[['dia','Dia de trabalho'],['relatorio','Relatórios'],['abastecimento','Abastecimento'],['custos','Custos'],['veiculo','Veículo'],['financiamento','Financiamento'],['combustivel','Combustível'],['estrategias','Estratégias'],['lembretes','Lembretes'],['config','Configurações']];
let tab=localStorage.getItem('df_tab');
if(!V[tab])tab='dia';
function render(){
  $('#tabs').innerHTML=TABS.map(([k,t])=>`<button data-tab="${k}" class="${k===tab?'on':''}">${t}</button>`).join('');
  $('#view').innerHTML=(flash?`<div class="card flash">${flash}</div>`:'')+V[tab]();
  flash='';
}
render();
</script>
